<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Booth · Hollowmoon Hill</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="%CSS%">
</head>
<body class="officer">
<header class="bar"><h1>📸 Photo Booth</h1><span class="sub">Hollowmoon Hill · officers only</span><span class="spacer"></span><span id="status" class="pill">…</span></header>
<main class="booth">
  <section class="players card">
    <input id="search" placeholder="Search name or code (e.g. K7Q2)" autocomplete="off">
    <div id="list"></div>
  </section>
  <section class="stage card">
    <div id="empty" class="empty">👈 Pick a student from the list (ask for the code on their screen)</div>
    <div id="shoot" class="hidden">
      <h2 id="who"></h2>
      <div class="cam-wrap">
        <video id="video" playsinline muted autoplay></video>
        <img id="still" class="hidden" alt="">
        <div class="guide"></div>
        <div id="busy" class="hidden"><div class="spin">🎃</div><p>The agent is designing their spooky self…</p></div>
      </div>
      <div class="row">
        <button id="snap" class="btn big orange">📸 Snap</button>
        <button id="flip" class="btn">🔄 Camera</button>
        <label class="btn"><input id="file" type="file" accept="image/*" capture="user" hidden>📁 Upload</label>
        <button id="retake" class="btn hidden">↩️ Retake</button>
        <button id="use" class="btn big teal hidden">✨ Make 3D!</button>
        <button id="drawing" class="btn hidden" title="A photo of a pumpkin face they drew on paper (or painted on a pumpkin)">🎃 Use as their pumpkin drawing</button>
      </div>
      <p id="camnote" class="note"></p>
    </div>
    <div id="result" class="hidden">
      <h2 id="rtitle"></h2>
      <canvas id="avatar-canvas" width="640" height="640"></canvas>
      <div id="traits" class="traits"></div>
      <div class="row"><button id="again" class="btn">📸 Retake photo</button><button id="random" class="btn">🎲 Random look instead</button><button id="next" class="btn big orange">Next student ➡️</button></div>
      <p class="note">Their character changed in the game already. Photos are not saved: only the avatar design is kept.</p>
    </div>
  </section>
</main>
<script type="module" src="%JS%"></script>
</body>
</html>
