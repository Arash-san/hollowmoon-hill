<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Speaker · Hollowmoon Hill</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="%CSS%">
</head>
<body class="officer">
<header class="bar"><h1>🔊 Room Speaker</h1><span class="sub">Open this on the PC plugged into the room speaker</span><span class="spacer"></span><span id="status" class="pill">…</span></header>
<main class="speaker">
  <div>
    <p class="big">Mayor Gourdon's Megaphone</p>
    <p id="last">Press start, then leave this tab open. Announcements and big moments in the game are read out loud here.</p>
    <button id="start" class="btn big orange">▶ Start the speaker</button>
    <p><label><input type="checkbox" id="toasts" checked> Also read boss and event alerts</label></p>
    <ul id="log"></ul>
  </div>
</main>
<script type="module" src="%JS%"></script>
</body>
</html>
